[package]
name = "framemc"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance native Rust Minecraft reverse proxy with zero-copy forwarding, Rhai scripting engine, and Velocity modern forwarding"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/framemc/framemc"
homepage = "https://github.com/framemc/framemc"
documentation = "https://docs.rs/framemc"
authors = ["FrameMC Contributors"]
keywords = ["minecraft", "reverse-proxy", "bungeecord", "velocity", "tokio"]
categories = ["network-programming", "game-development"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rhai = { version = "1.19", features = ["sync"] }
aes = "0.8"
cfb8 = "0.8"
rsa = "0.9"
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.8", features = ["v3", "v4", "serde"] }
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
rand = "0.8"
flate2 = "1.0"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
